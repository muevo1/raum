<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/industry-26a06414-09cd-4924-8c02-5d57c1b41497/styles.css">
  <script src="_ds/industry-26a06414-09cd-4924-8c02-5d57c1b41497/_ds_bundle.js"></script>
  <style>
    body { margin: 0; word-break: keep-all; text-wrap: pretty; }
    a { color: var(--color-accent-700); text-decoration: none; }
    a:hover { color: var(--color-accent-800); }
  </style>
</helmet>

<div style="background: var(--color-bg); color: var(--color-text); min-height: 100vh;">
  <nav class="nav" style="border-bottom: 1px solid var(--color-divider); padding: 18px clamp(20px,5vw,64px);">
    <a href="나란히 홈페이지.dc.html" style="display: flex; align-items: center; gap: 8px; color: inherit;">
      <span style="display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--color-accent); flex: none;"></span>
      <span class="nav-brand" style="margin: 0; font-size: 16px;">HERWAY CLUB</span>
      <span style="font-size: 9px; letter-spacing: 0.18em; color: var(--color-accent-700);">허웨이클럽</span>
    </a>
  </nav>

  <div style="max-width: 720px; margin: 0 auto; padding: 56px clamp(20px,5vw,64px) 140px;">
    <a href="나란히 홈페이지.dc.html#growth" style="font-size: 13px;">← 연령별 커뮤니티로</a>
    <span style="display: block; font-family: var(--font-heading); font-weight: 600; font-size: 11px; letter-spacing: 0.12em; color: var(--color-accent-700); margin: 24px 0 8px;">{{ age.label }} · {{ age.range }}</span>
    <h1 style="font-size: clamp(26px,3.2vw,34px); line-height: 1.35; letter-spacing: -0.015em; margin: 0 0 20px;">이 시기에 자주 나오는 주제</h1>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 40px;">
      <sc-for list="{{ age.topics }}" as="topic" hint-placeholder-count="5">
        <span class="tag tag-neutral">{{ topic }}</span>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{ age.posts }}" as="post" hint-placeholder-count="3">
        <div class="card" style="padding: 20px 22px; gap: 6px;">
          <div style="display: flex; align-items: center; gap: 7px; flex-wrap: wrap;">
            <span class="tag tag-neutral">예시</span>
            <span style="font-size: 12px; color: color-mix(in srgb, var(--color-text) 55%, transparent);">{{ post.topic }}</span>
            <span style="font-size: 12px; color: var(--color-accent-700);">· {{ post.hint }}</span>
          </div>
          <div style="font-size: 15.5px; font-weight: 500;">{{ post.title }}</div>
        </div>
      </sc-for>
    </div>
    <p style="font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 55%, transparent); line-height: 1.75; margin-top: 24px;">위 글은 실제 회원 글이 아니라, 이 시기에 자주 나오는 주제를 보여주는 예시입니다.</p>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { age: null };

  async componentDidMount() {
    const mod = await import('./content-data.js');
    const idx = parseInt(new URLSearchParams(window.location.search).get('age') || '2', 10);
    this.setState({ age: mod.ages[idx] || mod.ages[2] });
  }

  renderVals() {
    return { age: this.state.age || { label: '', range: '', topics: [], posts: [] } };
  }
}
</script>
</body>
</html>
