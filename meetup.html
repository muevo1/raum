<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모임 상세 · HERWAY CLUB</title>
<link rel="stylesheet" href="site-style.css">
<script src="site-data.js"></script>
<style>
  body { margin: 0; word-break: keep-all; text-wrap: pretty; }
  a { color: var(--color-accent-700); text-decoration: none; }
  a:hover { color: var(--color-accent-800); }
  .logo-mark { display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--color-accent); flex: none; }
</style>
</head>
<body style="background: var(--color-bg); color: var(--color-text); min-height: 100vh;">
  <nav class="nav" style="border-bottom: 1px solid var(--color-divider); padding: 18px clamp(20px,5vw,64px);">
    <a href="index.html" style="display: flex; align-items: center; gap: 8px; color: inherit;">
      <span class="logo-mark"></span>
      <span class="nav-brand" style="margin: 0; font-size: 16px;">HERWAY CLUB</span>
      <span style="font-size: 9px; letter-spacing: 0.18em; color: var(--color-accent-700);">허웨이클럽</span>
    </a>
  </nav>

  <div style="max-width: 720px; margin: 0 auto; padding: 56px clamp(20px,5vw,64px) 140px;">
    <a href="index.html#meetups" style="font-size: 13px;">← 모임 목록으로</a>
    <div class="blueprint" style="height: 260px; margin: 24px 0 28px;"><img id="m-img" style="width: 100%; height: 100%; object-fit: cover; display: block;"></div>
    <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 14px;">
      <span id="m-status" class="tag" style="background: var(--color-accent-100); color: var(--color-accent-800);"></span>
      <span class="tag tag-neutral">예시</span>
    </div>
    <h1 id="m-title" style="font-size: clamp(26px,3.2vw,34px); line-height: 1.35; letter-spacing: -0.015em; margin: 0 0 16px;"></h1>
    <p id="m-detail" style="font-size: 15px; color: color-mix(in srgb, var(--color-text) 78%, transparent); line-height: 1.85; margin: 0 0 24px;"></p>
    <div class="card" style="gap: 10px; padding: 22px; margin-bottom: 40px;">
      <div style="display: flex; justify-content: space-between; font-size: 14px; gap: 16px;"><span style="color: color-mix(in srgb, var(--color-text) 60%, transparent);">생활권 · 연령</span><span id="m-area"></span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; gap: 16px;"><span style="color: color-mix(in srgb, var(--color-text) 60%, transparent);">일정</span><span id="m-time"></span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; gap: 16px;"><span style="color: color-mix(in srgb, var(--color-text) 60%, transparent);">참가비</span><span id="m-price"></span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; gap: 16px;"><span style="color: color-mix(in srgb, var(--color-text) 60%, transparent);">동반</span><span style="color: var(--color-accent-700);">보호자 동반 필수</span></div>
    </div>
    <div id="apply">
      <div id="applyForm">
        <h2 style="font-size: 20px; margin: 0 0 18px;">참가 신청</h2>
        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div class="field"><label>보호자 이름</label><input id="a-name" class="input"></div>
          <div class="field"><label>연락처</label><input id="a-phone" class="input" placeholder="010-0000-0000"></div>
          <div class="field"><label>참가 인원 (아빠+딸)</label><input id="a-people" class="input" placeholder="예: 2명"></div>
          <button type="button" id="btn-apply" class="btn btn-primary btn-block" style="height: 46px;">참가 신청하기</button>
          <p id="applyErr" style="font-size: 13px; color: var(--color-accent-800); margin: 0; display: none;">이름, 연락처, 참가 인원을 입력해 주세요.</p>
        </div>
      </div>
      <div id="applyDone" class="card" style="display: none; padding: 28px; gap: 10px; text-align: center;">
        <h2 style="font-size: 20px; margin: 0;">신청이 접수되었습니다.</h2>
        <p id="applyDoneMsg" style="font-size: 14.5px; color: color-mix(in srgb, var(--color-text) 78%, transparent); line-height: 1.8; margin: 0;"></p>
      </div>
    </div>
  </div>
<script>
const D = window.SITE_DATA;
const id = parseInt(new URLSearchParams(location.search).get('id') || '0', 10);
const m = D.meetups[id] || D.meetups[0];
document.getElementById('m-img').src = m.img; document.getElementById('m-img').alt = m.imgHint;
document.getElementById('m-status').textContent = m.status;
document.getElementById('m-title').textContent = m.title;
document.getElementById('m-detail').textContent = m.detail;
document.getElementById('m-area').textContent = m.area;
document.getElementById('m-time').textContent = m.time;
document.getElementById('m-price').textContent = m.price;
document.getElementById('btn-apply').addEventListener('click', () => {
  const name = document.getElementById('a-name').value, phone = document.getElementById('a-phone').value, people = document.getElementById('a-people').value;
  if (!name || !phone || !people) { document.getElementById('applyErr').style.display = 'block'; return; }
  document.getElementById('applyDoneMsg').textContent = name + '님, "' + m.title + '" 모임 참가 신청이 접수되었습니다. 주최자가 연락처로 안내드립니다.';
  document.getElementById('applyForm').style.display = 'none';
  document.getElementById('applyDone').style.display = 'block';
});
</script>
</body>
</html>
