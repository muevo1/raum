<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ───────────────────────── utilities ───────────────────────── */
const W = 1080, H = 1920, DUR = 15;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: x => x,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outQuart: x => 1 - Math.pow(1 - x, 4),

  inOutQuart: x => x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2,
  inCubic: x => x * x * x,
  outBack: (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
};
const ep = (t, a, b, e = E.outExpo) => e(P(t, a, b));

function el(tag, parent, css = {}, html = '', cls = '') {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  Object.assign(e.style, css);
  if (html) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
const px = v => v + 'px';

/* A kinetic line: masked container + per-character spans */
function kline(parent, text, o) {
  const m = el('div', parent, {
    left: px(o.x ?? 0), top: px(o.y), font: `${o.style || ''} ${o.w || 900} ${o.size}px/1.12 ${o.fam || 'Pret'}`,
    color: o.color || 'var(--ink)', letterSpacing: o.ls || '-0.04em',
  }, '', 'mask');
  if (o.right != null) { m.style.left = 'auto'; m.style.right = px(o.right); }
  if (o.center) { m.style.left = '0'; m.style.right = '0'; m.style.textAlign = 'center'; m.style.padding = '0'; }
  const chars = [];
  for (const c of [...text]) {
    const s = el('span', m, {}, c === ' ' ? '&nbsp;' : c, 'ch');
    if (o.stroke) { s.style.webkitTextStroke = o.stroke; }
    chars.push(s);
  }

}
/* per-char rise-in; out: per-char rise-out */
function kin(k, t, t0, { stag = .035, dur = .7, ease = E.outExpo, from = 1.15, rot = 0, out = null, outStag = .02, outDur = .45 } = {}) {
  k.chars.forEach((c, i) => {
    const p = ease(P(t, t0 + i * stag, t0 + i * stag + dur));
    let y = (1 - p) * from * 100, r = (1 - p) * rot;
    if (out != null) {
      const q = E.inExpo(P(t, out + i * outStag, out + i * outStag + outDur));
      y -= q * 115;
    }
    c.style.transform = `translateY(${y}%) rotate(${r}deg)`;
  });
}

/* brilliant-cut diamond, top view */
function diamondSVG(size, color, sw) {
  const R = size / 2, c = R, pts = [], T = [], S = [], G = [];
  const pt = (r, a) => [c + r * Math.cos(a), c + r * Math.sin(a)];
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4 - Math.PI / 8;
    T.push(pt(R * .5, a)); S.push(pt(R * .74, a + Math.PI / 8)); G.push(pt(R, a));
  }
  let d = '';
  const L = (p, q) => d += `M${p[0].toFixed(1)} ${p[1].toFixed(1)}L${q[0].toFixed(1)} ${q[1].toFixed(1)}`;
  for (let k = 0; k < 8; k++) {
    const n = (k + 1) % 8;
    L(T[k], T[n]); L(T[k], S[k]); L(S[k], T[n]);
    L(T[k], G[k]); L(S[k], G[k]); L(S[k], G[n]);
    L(S[k], pt(R, k * Math.PI / 4));
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="${color}" stroke-width="${sw * 1.4}" pathLength="1" class="dr"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" pathLength="1" class="dr"/></svg>`;
}
const sparkleSVG = (s, col) => `<svg width="${s}" height="${s}" viewBox="-50 -50 100 100"><path d="M0-50C4-14 14-4 50 0C14 4 4 14 0 50C-4 14-14 4-50 0C-14-4-4-14 0-50Z" fill="${col}"/></svg>`;
const pearlSVG = s => `<svg width="${s}" height="${s}" viewBox="-50 -50 100 100"><defs><radialGradient id="pg" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#F1E8DA"/><stop offset="1" stop-color="#B9A88E"/></radialGradient></defs><circle r="48" fill="url(#pg)"/></svg>`;

/* ── S3 : 평생 착용할 수 있는 ── */
const s3 = {};

  ['tx', '14K', 'ivory'], ['tx', '∞', 'none'], ['img', 'p3'], ['svg', ringSVG(120, COLORS.gold2), 'ink'],

];

    border: kind === 'none' ? '2px solid rgba(18,17,16,.18)' : 'none', boxSizing: 'border-box' }, '', 'tile');

});
/* flip targets */
const FLIPS = [
  { i: 1, at: 7.35, html: `<img src="img/p2.jpg">`, bg: COLORS.ivory },

s4.imgs = ['p1', 'p3', 'p4', 'p5', 'p2'].map(k => el('img', s4.port, { position: 'absolute', left: '0', top: '0', width: '100%', height: '100%', objectFit: 'cover' }, '', '')).map((im, i) => (im.src = `img/${['p1', 'p3', 'p4', 'p5', 'p2'][i]}.jpg`, im));

const DOTS = [

/* ───────────────────────── three.js ───────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.localClippingEnabled = false;
const front = renderer.domElement; front.id = 'front';
document.getElementById('glwrap').appendChild(front);
const backCtx = document.getElementById('back').getContext('2d');

const scene3 = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene3.environment = pmrem.fromScene(new RoomEnvironment(), 0.035).texture;
scene3.environmentIntensity = 1.0;
const key = new THREE.DirectionalLight(0xfff4e0, 2.4); key.position.set(-600, 900, 1400); scene3.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 1.4); rim.position.set(900, -300, 600); scene3.add(rim);
scene3.add(new THREE.AmbientLight(0xffffff, .25));

const FOV = 30, D = (H / 2) / Math.tan(THREE.MathUtils.degToRad(FOV / 2));
const cam = new THREE.PerspectiveCamera(FOV, W / H, 20, 20000);
cam.position.set(0, 0, D); cam.lookAt(0, 0, 0);

/* domed band ring (comfort-fit profile), px units: inner radius 150 */
const RIN = 150, HR = 36, HH = 64;
function bandGeo() {
  const pts = [], n = 3.2, N = 96, cx = RIN + HR;
  for (let i = 0; i <= N; i++) {
    const th = Math.PI / 2 - i / N * Math.PI * 2;
    const c = Math.cos(th), s = Math.sin(th);
    const ex = c > 0 ? 2 / 2.2 : 2 / n;             // domed outside, flat inside
    const x = cx + HR * Math.sign(c) * Math.pow(Math.abs(c), ex);
    const y = HH * Math.sign(s) * Math.pow(Math.abs(s), 2 / n);
    pts.push(new THREE.Vector2(x, y));
  }
  const g = new THREE.LatheGeometry(pts, 200);
  g.computeVertexNormals();
  return g;
}
const gGeo = bandGeo();
const goldMat = new THREE.MeshPhysicalMaterial({ color: 0xF5C77E, metalness: 1, roughness: .17, clearcoat: .6, clearcoatRoughness: .08, envMapIntensity: 1.25, side: THREE.DoubleSide });
const wgMat = new THREE.MeshPhysicalMaterial({ color: 0xE9E9EC, metalness: 1, roughness: .15, clearcoat: .6, clearcoatRoughness: .08, envMapIntensity: 1.2, side: THREE.DoubleSide });
const pearlMat = new THREE.MeshPhysicalMaterial({ color: 0xF4EDE2, metalness: 0, roughness: .3, clearcoat: 1, clearcoatRoughness: .12, iridescence: .55, iridescenceIOR: 1.35, sheen: .6, sheenColor: new THREE.Color(0xffe3ea), sheenRoughness: .4 });
const ringG = new THREE.Mesh(gGeo, goldMat); scene3.add(ringG);
const ringW = new THREE.Mesh(gGeo, wgMat); scene3.add(ringW);
const pearls = [0, 1, 2].map(() => { const m = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), pearlMat); scene3.add(m); return m; });

const UP = new THREE.Vector3(0, 1, 0);
const tmpV = new THREE.Vector3();
function pose(x, y, z, axis, s) {           // screen px position + ring axis direction
  const q = new THREE.Quaternion().setFromUnitVectors(UP, tmpV.set(...axis).normalize().clone());
  return { p: new THREE.Vector3(x - W / 2, H / 2 - y, z), q, s };
}
function blend(a, b, t) {
  return { p: a.p.clone().lerp(b.p, t), q: a.q.clone().slerp(b.q, t), s: lerp(a.s, b.s, t) };
}
function apply(m, ps) { m.position.copy(ps.p); m.quaternion.copy(ps.q); m.scale.setScalar(ps.s); m.visible = ps.s > 0.001; }
function track(t, kf) {                     // kf: [[time, pose, ease?], ...]
  if (t <= kf[0][0]) return kf[0][1];
  for (let i = 1; i < kf.length; i++) {
    if (t <= kf[i][0]) return blend(kf[i - 1][1], kf[i][1], (kf[i][2] || E.inOutCubic)(P(t, kf[i - 1][0], kf[i][0])));
  }
  return kf[kf.length - 1][1];
}
function pearlAt(m, x, y, z, r) { m.position.set(x - W / 2, H / 2 - y, z); m.scale.setScalar(Math.max(r, .001)); m.visible = r > .5; }

/* S4 orbit pose */
function orbitPose(t) {
  const ph = 0.9 + (t - 8.6) * 1.75, a = -16 * Math.PI / 180;
  const ox = 380 * Math.cos(ph), oy = 118 * Math.sin(ph);
  const x = PC.x + ox * Math.cos(a) - oy * Math.sin(a), y = PC.y + ox * Math.sin(a) + oy * Math.cos(a);
  const z = 330 * Math.sin(ph);
  return pose(x, y, z, [Math.cos(t * 1.1), .55, Math.sin(t * 1.1)], .72);
}
/* S5 linked pair */
function pairPoses(t) {
  const g = new THREE.Object3D();
  g.position.set(0, H / 2 - 1330, 0);
  g.rotation.set(.32 + .05 * Math.sin(t * .9), -.55 + (t - 12) * .38, .12);
  g.scale.setScalar(.86);
  g.updateMatrixWorld();
  const mk = (x, axis) => {
    const o = new THREE.Object3D(); o.position.set(x, 0, 0);
    o.quaternion.setFromUnitVectors(UP, new THREE.Vector3(...axis)); g.add(o); o.updateMatrixWorld();
    const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
    o.matrixWorld.decompose(p, q, s); return { p, q, s: s.x };
  };
  return [mk(-(RIN + HR) / 2, [0, 0, 1]), mk((RIN + HR) / 2, [0, 1, 0])];
}

const planeBack = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
const planeFront = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

function update3D(t) {
  /* ---- gold ring ---- */
  let g;
  if (t < 3.08) {
    const wob = Math.sin(t * 2.2) * .08;
    const A = pose(1300, 180, 0, [-.2, .9, .4], .82);
    const B = pose(800, 768, 0, [-.62 + wob, .38, .7], .9);
    const C = pose(540, 960, 70, [0, 0, 1], 1);
    if (t < 2.25) g = track(t, [[0.15, A], [1.05, B, E.outExpo]]);
    else g = track(t, [[2.25, B], [2.6, C, E.inOutCubic]]);
    if (t > 2.6) {                                   // dive through the camera
      const s = lerp(1, 9.5, E.inExpo(P(t, 2.6, 3.05)));
      g = pose(540, 960, HH * s * 1.03 + 6, [0, 0, 1], s);
    }
  } else if (t < 6.2) {
    const spin = (t - 3) * 2.6 + E.inExpo(P(t, 5.25, 5.75)) * 6;
    const ax = [Math.sin(spin) * .96, .28, Math.cos(spin) * .96];
    const y = t < 5.25 ? lerp(2400, 715, ep(t, 3.05, 3.8)) : lerp(715, -600, E.inExpo(P(t, 5.25, 5.75)));
    g = pose(540, y, 0, ax, 1.42);
    if (t > 5.8) g.s = 0;
  } else if (t < 8.45) {
    g = pose(0, 0, 0, [0, 1, 0], 0);
  } else if (t < 11.4) {
    const O = orbitPose(t);
    g = blend(pose(1400, 600, 0, [1, .3, 0], .72), O, E.outExpo(P(t, 8.45, 9.2)));
  } else {
    const [pa] = pairPoses(t);
    g = blend(orbitPose(t), pa, E.inOutQuart(P(t, 11.4, 12.5)));
  }
  apply(ringG, g);

  /* ---- white-gold ring (end lockup) ---- */
  if (t > 12.1) {
    const [, pb] = pairPoses(t);
    pb.s *= E.outBack(P(t, 12.25, 12.95), 1.3);
    apply(ringW, pb);
  } else ringW.visible = false;

  /* ---- pearls ---- */
  pearls.forEach(p => p.visible = false);
  if (t < 2.7) {
    const r = 30 * E.outBack(P(t, .95, 1.35)) * (1 - E.inExpo(P(t, 2.25, 2.55)));
    pearlAt(pearls[0], 975 + Math.sin(t * 2) * 6, 610 + Math.cos(t * 2.4) * 6, 60, r);
    const r2 = 18 * E.outBack(P(t, 1.15, 1.5)) * (1 - E.inExpo(P(t, 2.2, 2.5)));
    pearlAt(pearls[1], 720 + Math.cos(t * 1.6) * 8, 1120 + Math.sin(t * 2) * 8, 60, r2);
  } else if (t > 3.2 && t < 5.9) {
    const k = (t - 3) * 1.6, rr = E.outBack(P(t, 3.4, 3.9)) * (1 - E.inExpo(P(t, 5.2, 5.6)));
    const cy = t < 5.25 ? lerp(2400, 715, ep(t, 3.05, 3.8)) : lerp(715, -600, E.inExpo(P(t, 5.25, 5.75)));
    pearlAt(pearls[0], 540 + 330 * Math.cos(k), cy + 60 * Math.sin(k), 300 * Math.sin(k), 30 * rr);
    pearlAt(pearls[1], 540 + 290 * Math.cos(k + 2.6), cy - 40 * Math.sin(k + 2.6), 260 * Math.sin(k + 2.6), 20 * rr);
  } else if (t > 8.6 && t < 11.9) {
    const rr = E.outBack(P(t, 8.9, 9.4)) * (1 - E.inExpo(P(t, 11.3, 11.7)));
    [[455, 175, -.9, 1.2, 34], [330, 330, 1.2, 3.3, 22], [380, 118, 1.75, 4.1, 16]].forEach(([rx, ry, sp, ph0, r], i) => {
      const ph = ph0 + (t - 8.6) * sp, a = -16 * Math.PI / 180;
      const ox = rx * Math.cos(ph), oy = ry * Math.sin(ph) * (ry === 330 ? .3 : 1);
      pearlAt(pearls[i], PC.x + ox * Math.cos(a) - oy * Math.sin(a), PC.y + ox * Math.sin(a) + oy * Math.cos(a), 300 * Math.sin(ph), r * rr);
    });
  }

  /* ---- two-pass render: behind text (z<0) → back canvas, in front (z>0) → front canvas ---- */
  renderer.clippingPlanes = [planeBack];
  renderer.render(scene3, cam);
  backCtx.clearRect(0, 0, W, H);
  backCtx.drawImage(front, 0, 0);
  renderer.clippingPlanes = [planeFront];
  renderer.render(scene3, cam);
}

/* ───────────────────────── timeline ───────────────────────── */
function circle(r, x, y) { return `circle(${Math.max(r, 0).toFixed(1)}px at ${x}px ${y}px)`; }
function invCircle(r, x, y) {
  r = Math.max(r, 0.01);
  return `path(evenodd, "M0 0H${W}V${H}H0Z M${x - r} ${y}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z")`;
}
function skyPts(t, t0) {                 // staggered columns rising from bottom
  const n = 6, w = W / n, pts = [];
  for (let i = 0; i < n; i++) {
    const p = E.inOutQuart(P(t, t0 + i * .045, t0 + i * .045 + .38));
    const y = H - p * (H + 2);
    pts.push([i * w, y], [(i + 1) * w, y]);
  }
  return pts;
}
const fmt = pts => pts.map(([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px`).join(',');
const skyline = (t, t0) => `polygon(${fmt([[0, H], ...skyPts(t, t0), [W, H]])})`;
const invSkyline = (t, t0) => `polygon(${fmt([[0, -2], [W, -2], ...skyPts(t, t0).reverse()])})`;
function fclip(sc, c) { sc.f.style.clipPath = c; }

function seek(t) {
  /* visibility & transitions */
  S1.show(t < 3.1);
  S2.show(t >= 2.55 && t < 6.5);
  S3.show(t >= 5.6 && t < 8.75);
  S4.show(t >= 8.3 && t < 12.1);
  S5.show(t >= 11.4);
  // S1→S2 through the ring's hole
  if (t < 3.05) {
    const s = t > 2.6 ? lerp(1, 9.5, E.inExpo(P(t, 2.6, 3.05))) : 0;
    const z = HH * s * 1.03 + 6 - HH * s;           // far face of the band
    const r = s ? RIN * s * D / (D - z) - 2 : 0;
    S2.clip(circle(r, 540, 960)); fclip(S1, invCircle(r, 540, 960));
  } else S2.clip('none');
  S3.clip(t < 6.1 ? skyline(t, 5.62) : 'none');
  if (t >= 5.6 && t < 6.1) fclip(S2, invSkyline(t, 5.62));
  const r4 = E.inOutCubic(P(t, 8.32, 8.72)) * 1150;
  S4.clip(t < 8.72 ? circle(r4, 540, 1010) : 'none'); if (t >= 8.3) fclip(S3, invCircle(r4, 540, 1010)); else if (t >= 6.1) fclip(S3, 'none');
  const r5 = lerp(PR, 1150, E.inOutQuart(P(t, 11.5, 12.0)));
  S5.clip(t < 12.0 ? circle(r5, PC.x, PC.y) : 'none'); if (t >= 11.5) fclip(S4, invCircle(r5, PC.x, PC.y)); else fclip(S4, 'none');

  /* chrome colour per scene */
  const dark = (t >= 2.9 && t < 5.85) || (t >= 8.52 && t < 11.75);
  const cc = dark ? COLORS.ivory : COLORS.ink;
  for (const k of ['tl', 'tr', 'bl', 'br']) ch[k].style.color = cc;
  ch.cm1.style.borderColor = ch.cm2.style.borderColor = cc;
  ch.track.style.background = cc;
  ch.bar.style.background = dark ? COLORS.gold2 : COLORS.gold;
  ch.bar.style.transform = `scaleX(${t / DUR})`;
  const ci = ep(t, 0, .6);
  for (const k of ['tl', 'tr', 'bl', 'br', 'cm1', 'cm2']) ch[k].style.opacity = ci;
  ch.tr.textContent = t < 11.8 ? 'CLASSIC IN MOTION' : 'SINCE 2022';

  /* ── S1 ── */
  s1.hair.style.transform = `scaleX(${ep(t, .1, .9, E.inOutQuart)})`;
  s1.idx.style.opacity = ep(t, .3, .8);
  kin(s1.l1, t, .22, { stag: .07, dur: .8, rot: 6 });
  kin(s1.l1o, t, .22, { stag: .07, dur: .8, rot: 6 });
  kin(s1.l2, t, .42, { stag: .07, dur: .8, rot: 6 });
  const hollow = ep(t, 1.55, 2.0, E.inOutCubic);
  s1.l1.chars.forEach((c, i) => c.style.opacity = 1 - E.inOutCubic(P(t, 1.55 + i * .07, 1.95 + i * .07)));
  s1.strike.style.transform = `scaleX(${ep(t, 1.45, 1.9, E.inOutQuart)})`;
  kin(s1.en, t, 1.75, { stag: .025, dur: .7 });
  s1.c1.style.opacity = s1.c2.style.opacity = ep(t, 1.0, 1.6);
  s1.c1.style.transform = s1.c2.style.transform = `translateY(${(1 - ep(t, 1.0, 1.6)) * 30}px)`;
  // punch: whole S1 type block leans back as the ring dives
  const dive = E.inExpo(P(t, 2.55, 3.05));
  S1.f.style.transform = `scale(${1 + dive * .08})`; S1.f.style.transformOrigin = '540px 960px';

  /* ── S2 ── */
  s2.rows.forEach((r, i) => {
    const dir = i % 2 ? 1 : -1, base = i % 2 ? -1180 : -300;
    const enter = (1 - ep(t, 2.6, 3.5)) * 500 * dir;
    r.style.transform = `translateX(${base + dir * (t - 2.6) * 95 + enter}px)`;
  });
  s2.hair.style.transform = `scaleX(${ep(t, 3.5, 4.2, E.inOutQuart)})`;
  s2.idx.style.opacity = s2.idx2.style.opacity = ep(t, 3.7, 4.2) * (1 - ep(t, 5.4, 5.7));
  kin(s2.l1, t, 3.75, { stag: .05, dur: .75, rot: 5, out: 5.35 });
  kin(s2.l2, t, 3.98, { stag: .05, dur: .75, rot: 5, out: 5.42 });

  /* ── S3 ── */
  s3.idx.style.opacity = s3.arr.style.opacity = ep(t, 6.0, 6.4);
  kin(s3.l1, t, 5.95, { stag: .09, dur: .8, from: 1.2 });
  kin(s3.l1b, t, 6.35, { stag: .02, dur: .7 });
  s3.tiles.forEach((o, i) => {
    const t0 = 6.15 + (o.r + o.c) * .07;
    const p = P(t, t0, t0 + .55), e = E.outBack(p, 1.6);
    let sx = e, sy = e;
    for (const f of FLIPS) if (f.i === i) {
      const q = P(t, f.at, f.at + .32);
      const useNew = q >= .5;
      if (o.inner.dataset.state !== String(useNew)) {
        o.inner.dataset.state = String(useNew);
        o.inner.innerHTML = useNew ? f.html : f.orig.html;
        o.t.style.background = useNew ? f.bg : f.orig.bg;
      }
      sx *= Math.abs(Math.cos(E.inOutCubic(q) * Math.PI));
    }
    o.t.style.opacity = clamp(p * 3);
    o.t.style.transform = `scale(${sx},${sy}) rotate(${(1 - E.outExpo(p)) * -10}deg)`;
    const img = o.inner.querySelector('img');
    if (img) img.style.transform = `scale(${1 + (t - 6) * .025})`;
    o.inner.querySelectorAll('.dr').forEach((d, j) => { d.style.strokeDasharray = '1'; d.style.strokeDashoffset = String(1 - E.inOutCubic(P(t, 6.5 + j * .15, 7.3 + j * .15))); });
  });
  kin(s3.l2, t, 6.6, { stag: .045, dur: .7, rot: 4 });
  s3.c0.style.opacity = s3.c1.style.opacity = ep(t, 7.0, 7.5);
  // gentle grid drift
  S3.f.style.transform = `translateY(${(1 - ep(t, 5.8, 7.0)) * 40}px)`;

  /* ── S4 ── */
  kin(s4.l1, t, 8.55, { stag: .06, dur: .75, rot: 5 });
  kin(s4.l2, t, 8.72, { stag: .06, dur: .75, rot: 5 });
  s4.tag.style.opacity = ep(t, 9.1, 9.5);
  const pin = E.outBack(P(t, 8.6, 9.3), 1.4);
  s4.port.style.transform = s4.portRing.style.transform = `scale(${pin})`;
  s4.portRing.style.opacity = 1 - ep(t, 11.2, 11.5);
  const CUTS = [8.6, 9.2, 9.75, 10.3, 10.85];
  s4.imgs.forEach((im, i) => {
    const inP = i === 0 ? 1 : E.inOutExpo(P(t, CUTS[i] - .18, CUTS[i] + .22));
    im.style.transform = `translateY(${(1 - inP) * 100}%) scale(${1.12 - .1 * P(t, CUTS[i] - .2, CUTS[i] + .8)})`;
    im.style.zIndex = i;
  });
  s4.ivoryDisc.style.zIndex = 9;
  s4.ivoryDisc.style.transform = `translateY(${(1 - E.inOutExpo(P(t, 11.1, 11.45))) * 100}%)`;
  s4.spec.style.opacity = ep(t, 9.4, 9.9) * (1 - ep(t, 11.1, 11.3));
  kin(s4.l3, t, 9.6, { stag: .035, dur: .7, out: 11.05 });
  kin(s4.l4, t, 9.7, { stag: .035, dur: .7, out: 11.1 });
  s4.idx.style.opacity = ep(t, 9.8, 10.2) * (1 - ep(t, 11.1, 11.3));
  const oa = -16 * Math.PI / 180;
  DOTS.forEach(d => {
    const ph = d.ph + (t - 8.6) * d.sp, ox = d.rx * Math.cos(ph), oy = d.ry * Math.sin(ph);
    const x = PC.x + ox * Math.cos(oa) - oy * Math.sin(oa), y = PC.y + ox * Math.sin(oa) + oy * Math.cos(oa);
    const s = ep(t, 9.0, 9.5, E.outQuart) * (1 - ep(t, 11.1, 11.4));
    for (const c of [d.b, d.f]) { c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', d.r * s); }
    const frontSide = Math.sin(ph) > 0;
    d.f.style.display = frontSide ? 'inline' : 'none'; d.b.style.display = frontSide ? 'none' : 'inline';
  });
  s4.orbitB.style.opacity = ep(t, 8.8, 9.4) * (1 - ep(t, 11.1, 11.4));
  s4.orbitB.style.transform = `rotate(${(t - 8.6) * 2}deg)`; s4.orbitB.style.transformOrigin = `${PC.x}px ${PC.y}px`;

  /* ── S5 ── */
  s5.shadow.style.opacity = ep(t, 12.2, 13.0);
  s5.shadow.style.transform = `scaleX(${.8 + .2 * ep(t, 12.2, 13.0)})`;
  s5.tag.style.opacity = ep(t, 12.7, 13.3);
  s5.tag.style.letterSpacing = `${.6 - .4 * ep(t, 12.7, 14.2, E.outQuart)}em`;
  kin(s5.logo, t, 11.95, { stag: .075, dur: 1.0, from: 1.1 });
  s5.logo.m.style.letterSpacing = `${.26 - .16 * ep(t, 11.95, 13.6, E.outQuart)}em`;
  kin(s5.kr, t, 12.45, { stag: .09, dur: .8 });
  s5.hair.style.transform = `scaleX(${ep(t, 12.6, 13.3, E.inOutQuart)})`;
  kin(s5.t1, t, 12.85, { stag: .014, dur: .7 });
  kin(s5.t2, t, 13.1, { stag: .012, dur: .7 });

  update3D(t);
}

window.seek = seek;
await document.fonts.ready;
await Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => i.onload = i.onerror = r)));
await new Promise(r => { const tmp = new Image(); tmp.onload = tmp.onerror = r; tmp.src = 'img/p2.jpg'; });
seek(0);
window.READY = true;
</script>
