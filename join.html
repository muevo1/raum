<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가입 신청 · HERWAY CLUB</title>
<link rel="stylesheet" href="site-style.css">
<style>
  body { margin: 0; word-break: keep-all; text-wrap: pretty; }
  a { color: var(--color-accent-700); text-decoration: none; }
  a:hover { color: var(--color-accent-800); }
  .logo-mark { display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--color-accent); flex: none; }
</style>
</head>
<body style="background: var(--color-bg); color: var(--color-text); min-height: 100vh;">
  <nav class="nav" style="border-bottom: 1px solid var(--color-divider); padding: 18px clamp(20px,5vw,64px);">
    <a href="index.html" style="display: flex; align-items: center; gap: 8px; color: inherit;">
      <span class="logo-mark"></span>
      <span class="nav-brand" style="margin: 0; font-size: 16px;">HERWAY CLUB</span>
      <span style="font-size: 9px; letter-spacing: 0.18em; color: var(--color-accent-700);">허웨이클럽</span>
    </a>
  </nav>

  <div style="max-width: 640px; margin: 0 auto; padding: 64px clamp(20px,5vw,64px) 140px;">
    <span style="font-family: var(--font-heading); font-weight: 600; font-size: 12px; letter-spacing: 0.14em; color: var(--color-accent-700);">가입 신청</span>

    <div id="step1">
      <h1 style="font-size: clamp(28px,3.6vw,38px); line-height: 1.3; letter-spacing: -0.015em; margin: 14px 0 8px;">딸만 둔 아빠를 위한<br>승인제 커뮤니티에 신청합니다.</h1>
      <p style="font-size: 14.5px; color: color-mix(in srgb, var(--color-text) 78%, transparent); line-height: 1.8; margin: 0 0 36px;">검토는 보통 24시간 이내에 끝나고, 확인이 끝나면 제출하신 자료 원본은 보관하지 않습니다.</p>
      <div style="display: flex; flex-direction: column; gap: 20px;">
        <div class="field"><label>이름</label><input id="f-name" class="input" placeholder="홍길동"></div>
        <div class="field"><label>연락처</label><input id="f-phone" class="input" placeholder="010-0000-0000"></div>
        <div class="field"><label>이메일</label><input id="f-email" class="input" type="email" placeholder="you@example.com"></div>
        <div class="field"><label>딸의 수와 연령대</label><input id="f-daughters" class="input" placeholder="예: 딸 1명, 8세"></div>
        <label class="radio" style="font-size: 13.5px; align-items: flex-start; gap: 10px; cursor: pointer;">
          <input id="f-agree" type="checkbox" style="margin-top: 2px;">
          <span>운영 원칙과 개인정보 처리방침에 동의합니다. 자녀 정보는 최소한으로 수집되며, 확인 후 원본은 보관하지 않습니다.</span>
        </label>
        <button type="button" id="btn-next" class="btn btn-primary btn-block" style="height: 48px; margin-top: 8px;">다음</button>
        <p id="err1" style="font-size: 13px; color: var(--color-accent-800); margin: 0; display: none;">이름, 연락처, 이메일을 입력하고 동의에 체크해 주세요.</p>
      </div>
    </div>

    <div id="step2" style="display: none;">
      <h1 style="font-size: clamp(26px,3.2vw,34px); line-height: 1.3; letter-spacing: -0.015em; margin: 14px 0 24px;">입력하신 내용을 확인해 주세요.</h1>
      <div class="card" style="gap: 14px; padding: 24px;">
        <div style="display: flex; justify-content: space-between; font-size: 14.5px; gap: 16px;"><span style="color: color-mix(in srgb, var(--color-text) 60%, transparent);">이름</span><span id="r-name"></span></div>
        <div style="display: flex; justify-content: space-between; font-size: 14.5px; gap: 16px;"><span style="color: color-mix(in srgb, var(--color-text) 60%, transparent);">연락처</span><span id="r-phone"></span></div>
        <div style="display: flex; justify-content: space-between; font-size: 14.5px; gap: 16px;"><span style="color: color-mix(in srgb, var(--color-text) 60%, transparent);">이메일</span><span id="r-email"></span></div>
        <div style="display: flex; justify-content: space-between; font-size: 14.5px; gap: 16px;"><span style="color: color-mix(in srgb, var(--color-text) 60%, transparent);">딸의 수와 연령대</span><span id="r-daughters"></span></div>
      </div>
      <p style="font-size: 13px; color: color-mix(in srgb, var(--color-text) 55%, transparent); line-height: 1.8; margin: 20px 0 0;">제출 후 가족관계 확인을 위한 서류 안내를 이메일로 보내드립니다.</p>
      <div style="display: flex; gap: 10px; margin-top: 28px;">
        <button type="button" id="btn-back" class="btn btn-secondary" style="height: 46px; flex: 1;">이전</button>
        <button type="button" id="btn-submit" class="btn btn-primary" style="height: 46px; flex: 2;">제출하기</button>
      </div>
    </div>

    <div id="step3" style="display: none;">
      <h1 style="font-size: clamp(26px,3.2vw,34px); line-height: 1.3; letter-spacing: -0.015em; margin: 14px 0 12px;">신청이 접수되었습니다.</h1>
      <p id="doneMsg" style="font-size: 15px; color: color-mix(in srgb, var(--color-text) 78%, transparent); line-height: 1.85; margin: 0 0 32px;"></p>
      <a href="index.html" class="btn btn-primary" style="height: 48px; padding: 0 28px;">홈으로 돌아가기</a>
    </div>
  </div>

<script>
document.getElementById('btn-next').addEventListener('click', () => {
  const name = document.getElementById('f-name').value, phone = document.getElementById('f-phone').value,
        email = document.getElementById('f-email').value, agree = document.getElementById('f-agree').checked;
  if (!name || !phone || !email || !agree) { document.getElementById('err1').style.display = 'block'; return; }
  document.getElementById('err1').style.display = 'none';
  document.getElementById('r-name').textContent = name;
  document.getElementById('r-phone').textContent = phone;
  document.getElementById('r-email').textContent = email;
  document.getElementById('r-daughters').textContent = document.getElementById('f-daughters').value;
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').style.display = 'block';
});
document.getElementById('btn-back').addEventListener('click', () => {
  document.getElementById('step2').style.display = 'none';
  document.getElementById('step1').style.display = 'block';
});
document.getElementById('btn-submit').addEventListener('click', () => {
  document.getElementById('doneMsg').textContent = document.getElementById('r-name').textContent + '님, 신청해 주셔서 감사합니다. 가입 자격 확인은 보통 24시간 이내에 끝나며, 결과는 ' + document.getElementById('r-email').textContent + '로 안내드립니다.';
  document.getElementById('step2').style.display = 'none';
  document.getElementById('step3').style.display = 'block';
});
</script>
</body>
</html>
