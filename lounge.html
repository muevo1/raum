<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연령별 라운지 · HERWAY CLUB</title>
<link rel="stylesheet" href="site-style.css">
<script src="site-data.js"></script>
<style>
  body { margin: 0; word-break: keep-all; text-wrap: pretty; }
  a { color: var(--color-accent-700); text-decoration: none; }
  a:hover { color: var(--color-accent-800); }
  .logo-mark { display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--color-accent); flex: none; }
</style>
</head>
<body style="background: var(--color-bg); color: var(--color-text); min-height: 100vh;">
  <nav class="nav" style="border-bottom: 1px solid var(--color-divider); padding: 18px clamp(20px,5vw,64px);">
    <a href="index.html" style="display: flex; align-items: center; gap: 8px; color: inherit;">
      <span class="logo-mark"></span>
      <span class="nav-brand" style="margin: 0; font-size: 16px;">HERWAY CLUB</span>
      <span style="font-size: 9px; letter-spacing: 0.18em; color: var(--color-accent-700);">허웨이클럽</span>
    </a>
  </nav>
  <div style="max-width: 720px; margin: 0 auto; padding: 56px clamp(20px,5vw,64px) 140px;">
    <a href="index.html#growth" style="font-size: 13px;">← 연령별 커뮤니티로</a>
    <span id="l-label" style="display: block; font-family: var(--font-heading); font-weight: 600; font-size: 11px; letter-spacing: 0.12em; color: var(--color-accent-700); margin: 24px 0 8px;"></span>
    <h1 style="font-size: clamp(26px,3.2vw,34px); line-height: 1.35; letter-spacing: -0.015em; margin: 0 0 20px;">이 시기에 자주 나오는 주제</h1>
    <div id="l-topics" style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 40px;"></div>
    <div id="l-posts" style="display: flex; flex-direction: column; gap: 10px;"></div>
    <p style="font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 55%, transparent); line-height: 1.75; margin-top: 24px;">위 글은 실제 회원 글이 아니라, 이 시기에 자주 나오는 주제를 보여주는 예시입니다.</p>
  </div>
<script>
const D = window.SITE_DATA;
const idx = parseInt(new URLSearchParams(location.search).get('age') || '2', 10);
const a = D.ages[idx] || D.ages[2];
document.getElementById('l-label').textContent = a.label + ' · ' + a.range;
document.getElementById('l-topics').innerHTML = a.topics.map(t => `<span class="tag tag-neutral">${t}</span>`).join('');
document.getElementById('l-posts').innerHTML = a.posts.map(p => `
  <div class="card" style="padding: 20px 22px; gap: 6px;">
    <div style="display: flex; align-items: center; gap: 7px; flex-wrap: wrap;">
      <span class="tag tag-neutral">예시</span>
      <span style="font-size: 12px; color: color-mix(in srgb, var(--color-text) 55%, transparent);">${p.topic}</span>
      <span style="font-size: 12px; color: var(--color-accent-700);">· ${p.hint}</span>
    </div>
    <div style="font-size: 15.5px; font-weight: 500;">${p.title}</div>
  </div>`).join('');
</script>
</body>
</html>
