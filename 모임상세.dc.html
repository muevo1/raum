<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/industry-26a06414-09cd-4924-8c02-5d57c1b41497/styles.css">
  <script src="_ds/industry-26a06414-09cd-4924-8c02-5d57c1b41497/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
  <style>
    body { margin: 0; word-break: keep-all; text-wrap: pretty; }
    a { color: var(--color-accent-700); text-decoration: none; }
    a:hover { color: var(--color-accent-800); }
  </style>
</helmet>

<div style="background: var(--color-bg); color: var(--color-text); min-height: 100vh;">
  <nav class="nav" style="border-bottom: 1px solid var(--color-divider); padding: 18px clamp(20px,5vw,64px);">
    <a href="나란히 홈페이지.dc.html" style="display: flex; align-items: center; gap: 8px; color: inherit;">
      <span style="display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--color-accent); flex: none;"></span>
      <span class="nav-brand" style="margin: 0; font-size: 16px;">HERWAY CLUB</span>
      <span style="font-size: 9px; letter-spacing: 0.18em; color: var(--color-accent-700);">허웨이클럽</span>
    </a>
  </nav>

  <div style="max-width: 720px; margin: 0 auto; padding: 56px clamp(20px,5vw,64px) 140px;">
    <a href="나란히 홈페이지.dc.html#meetups" style="font-size: 13px;">← 모임 목록으로</a>

    <div class="blueprint" style="height: 260px; margin: 24px 0 28px;">
      <image-slot id="meetup-detail-{{ meetupId }}" shape="rect" placeholder="{{ meetup.imgHint }}" style="width: 100%; height: 100%;"></image-slot>
    </div>

    <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 14px;">
      <span class="tag" style="background: var(--color-accent-100); color: var(--color-accent-800);">{{ meetup.status }}</span>
      <span class="tag tag-neutral">예시</span>
    </div>
    <h1 style="font-size: clamp(26px,3.2vw,34px); line-height: 1.35; letter-spacing: -0.015em; margin: 0 0 16px;">{{ meetup.title }}</h1>
    <p style="font-size: 15px; color: color-mix(in srgb, var(--color-text) 78%, transparent); line-height: 1.85; margin: 0 0 24px;">{{ meetup.detail }}</p>

    <div class="card" style="gap: 10px; padding: 22px; margin-bottom: 40px;">
      <div style="display: flex; justify-content: space-between; font-size: 14px; gap: 16px;"><span style="color: color-mix(in srgb, var(--color-text) 60%, transparent);">생활권 · 연령</span><span>{{ meetup.area }}</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; gap: 16px;"><span style="color: color-mix(in srgb, var(--color-text) 60%, transparent);">일정</span><span>{{ meetup.time }}</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; gap: 16px;"><span style="color: color-mix(in srgb, var(--color-text) 60%, transparent);">참가비</span><span>{{ meetup.price }}</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; gap: 16px;"><span style="color: color-mix(in srgb, var(--color-text) 60%, transparent);">동반</span><span style="color: var(--color-accent-700);">보호자 동반 필수</span></div>
    </div>

    <div id="apply">
      <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
        <h2 style="font-size: 20px; margin: 0 0 18px;">참가 신청</h2>
        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div class="field"><label>보호자 이름</label><input class="input" value="{{ form.name }}" onChange="{{ setField('name') }}" /></div>
          <div class="field"><label>연락처</label><input class="input" placeholder="010-0000-0000" value="{{ form.phone }}" onChange="{{ setField('phone') }}" /></div>
          <div class="field"><label>참가 인원 (아빠+딸)</label><input class="input" placeholder="예: 2명" value="{{ form.people }}" onChange="{{ setField('people') }}" /></div>
          <button type="button" class="btn btn-primary btn-block" style="height: 46px;" onClick="{{ submit }}" disabled="{{ !canSubmit }}">참가 신청하기</button>
          <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
            <p style="font-size: 13px; color: var(--color-accent-800); margin: 0;">이름, 연락처, 참가 인원을 입력해 주세요.</p>
          </sc-if>
        </div>
      </sc-if>
      <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
        <div class="card" style="padding: 28px; gap: 10px; text-align: center;">
          <h2 style="font-size: 20px; margin: 0;">신청이 접수되었습니다.</h2>
          <p style="font-size: 14.5px; color: color-mix(in srgb, var(--color-text) 78%, transparent); line-height: 1.8; margin: 0;">{{ form.name }}님, "{{ meetup.title }}" 모임 참가 신청이 접수되었습니다. 주최자가 연락처로 안내드립니다.</p>
        </div>
      </sc-if>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    meetup: null,
    meetupId: 0,
    step: 'form',
    showError: false,
    form: { name: '', phone: '', people: '' }
  };

  async componentDidMount() {
    const mod = await import('./content-data.js');
    const id = parseInt(new URLSearchParams(window.location.search).get('id') || '0', 10);
    this.setState({ meetup: mod.meetups[id] || mod.meetups[0], meetupId: id });
  }

  setField(key) {
    return (e) => {
      const val = e.target.value;
      this.setState(s => ({ form: { ...s.form, [key]: val } }));
    };
  }

  submit() {
    const f = this.state.form;
    if (!f.name || !f.phone || !f.people) {
      this.setState({ showError: true });
      return;
    }
    this.setState({ step: 'done', showError: false });
  }

  renderVals() {
    return {
      meetup: this.state.meetup || { imgHint: '', status: '', title: '', detail: '', area: '', time: '', price: '' },
      meetupId: this.state.meetupId,
      form: this.state.form,
      isForm: this.state.step === 'form',
      isDone: this.state.step === 'done',
      showError: this.state.showError,
      canSubmit: !!(this.state.form.name && this.state.form.phone && this.state.form.people),
      setField: (key) => this.setField(key),
      submit: () => this.submit()
    };
  }
}
</script>
</body>
</html>
