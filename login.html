<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · HERWAY CLUB</title>
<link rel="stylesheet" href="site-style.css">
<style>
  body { margin: 0; word-break: keep-all; text-wrap: pretty; }
  a { color: var(--color-accent-700); text-decoration: none; }
  a:hover { color: var(--color-accent-800); }
  .logo-mark { display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--color-accent); flex: none; }
</style>
</head>
<body style="background: var(--color-bg); color: var(--color-text); min-height: 100vh;">
  <nav class="nav" style="border-bottom: 1px solid var(--color-divider); padding: 18px clamp(20px,5vw,64px);">
    <a href="index.html" style="display: flex; align-items: center; gap: 8px; color: inherit;">
      <span class="logo-mark"></span>
      <span class="nav-brand" style="margin: 0; font-size: 16px;">HERWAY CLUB</span>
      <span style="font-size: 9px; letter-spacing: 0.18em; color: var(--color-accent-700);">허웨이클럽</span>
    </a>
  </nav>
  <div style="max-width: 400px; margin: 0 auto; padding: 88px clamp(20px,5vw,64px) 140px;">
    <div id="form">
      <h1 style="font-size: 28px; letter-spacing: -0.015em; margin: 0 0 28px; text-align: center;">로그인</h1>
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div class="field"><label>이메일</label><input id="l-email" class="input" type="email" placeholder="you@example.com"></div>
        <div class="field"><label>비밀번호</label><input id="l-password" class="input" type="password" placeholder="••••••••"></div>
        <button type="button" id="btn-login" class="btn btn-primary btn-block" style="height: 46px;">로그인</button>
        <p id="loginErr" style="font-size: 13px; color: var(--color-accent-800); margin: 0; text-align: center; display: none;">이메일과 비밀번호를 입력해 주세요.</p>
        <p style="font-size: 13px; color: color-mix(in srgb, var(--color-text) 55%, transparent); text-align: center; margin: 8px 0 0;">계정이 없으신가요? <a href="join.html">가입 신청하기</a></p>
      </div>
    </div>
    <div id="done" style="display: none; text-align: center;">
      <h1 style="font-size: 26px; letter-spacing: -0.015em; margin: 0 0 12px;">로그인되었습니다.</h1>
      <p id="doneEmail" style="font-size: 14.5px; color: color-mix(in srgb, var(--color-text) 78%, transparent); line-height: 1.8; margin: 0 0 28px;"></p>
      <a href="index.html" class="btn btn-primary" style="height: 46px; padding: 0 26px;">홈으로 이동</a>
    </div>
  </div>
<script>
document.getElementById('btn-login').addEventListener('click', () => {
  const email = document.getElementById('l-email').value, pw = document.getElementById('l-password').value;
  if (!email || !pw) { document.getElementById('loginErr').style.display = 'block'; return; }
  document.getElementById('doneEmail').textContent = email + '로 접속했습니다. (프로토타입 화면입니다)';
  document.getElementById('form').style.display = 'none';
  document.getElementById('done').style.display = 'block';
});
</script>
</body>
</html>
