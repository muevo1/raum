<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자주 묻는 질문 · HERWAY CLUB</title>
<link rel="stylesheet" href="site-style.css">
<script src="site-data.js"></script>
<style>
  body { margin: 0; word-break: keep-all; text-wrap: pretty; }
  a { color: var(--color-accent-700); text-decoration: none; }
  a:hover { color: var(--color-accent-800); }
  .logo-mark { display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--color-accent); flex: none; }
</style>
</head>
<body style="background: var(--color-bg); color: var(--color-text); min-height: 100vh;">
  <nav class="nav" style="border-bottom: 1px solid var(--color-divider); padding: 18px clamp(20px,5vw,64px);">
    <a href="index.html" style="display: flex; align-items: center; gap: 8px; color: inherit;">
      <span class="logo-mark"></span>
      <span class="nav-brand" style="margin: 0; font-size: 16px;">HERWAY CLUB</span>
      <span style="font-size: 9px; letter-spacing: 0.18em; color: var(--color-accent-700);">허웨이클럽</span>
    </a>
  </nav>
  <div style="max-width: 720px; margin: 0 auto; padding: 56px clamp(20px,5vw,64px) 140px;">
    <a href="index.html#empathy" style="font-size: 13px;">← 홈으로</a>
    <h1 style="font-size: clamp(28px,3.6vw,38px); line-height: 1.3; letter-spacing: -0.015em; margin: 24px 0 40px;">자주 묻는 질문 전체</h1>
    <div id="faq-list" style="display: flex; flex-direction: column;"></div>
    <div style="border-top: 1px solid var(--color-divider);"></div>
  </div>
<script>
const D = window.SITE_DATA;
let open = -1;
function render() {
  document.getElementById('faq-list').innerHTML = D.faqData.map((f, i) => `
    <div style="border-top: 1px solid var(--color-divider);">
      <button type="button" data-i="${i}" style="all: unset; display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; cursor: pointer; padding: 22px 0;">
        <span style="font-size: 16.5px; font-weight: 600;">${f.q}</span>
        <span style="font-family: var(--font-heading); font-size: 18px; color: var(--color-accent-700); flex: none;">${open===i?'−':'+'}</span>
      </button>
      ${open===i ? `<p style="font-size: 14.5px; color: color-mix(in srgb, var(--color-text) 78%, transparent); line-height: 1.85; margin: 0 0 22px;">${f.a}</p>` : ''}
    </div>`).join('');
  document.querySelectorAll('#faq-list button').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.i; open = open===i ? -1 : i; render(); }));
}
render();
</script>
</body>
</html>
