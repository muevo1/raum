<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/industry-26a06414-09cd-4924-8c02-5d57c1b41497/styles.css">
  <script src="_ds/industry-26a06414-09cd-4924-8c02-5d57c1b41497/_ds_bundle.js"></script>
  <style>
    body { margin: 0; word-break: keep-all; text-wrap: pretty; }
    a { color: var(--color-accent-700); text-decoration: none; }
    a:hover { color: var(--color-accent-800); }
  </style>
</helmet>

<div style="background: var(--color-bg); color: var(--color-text); min-height: 100vh;">
  <nav class="nav" style="border-bottom: 1px solid var(--color-divider); padding: 18px clamp(20px,5vw,64px);">
    <a href="나란히 홈페이지.dc.html" style="display: flex; align-items: center; gap: 8px; color: inherit;">
      <span style="display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--color-accent); flex: none;"></span>
      <span class="nav-brand" style="margin: 0; font-size: 16px;">HERWAY CLUB</span>
      <span style="font-size: 9px; letter-spacing: 0.18em; color: var(--color-accent-700);">허웨이클럽</span>
    </a>
  </nav>

  <div style="max-width: 720px; margin: 0 auto; padding: 56px clamp(20px,5vw,64px) 140px;">
    <a href="나란히 홈페이지.dc.html#empathy" style="font-size: 13px;">← 홈으로</a>
    <h1 style="font-size: clamp(28px,3.6vw,38px); line-height: 1.3; letter-spacing: -0.015em; margin: 24px 0 40px;">자주 묻는 질문 전체</h1>
    <div style="display: flex; flex-direction: column;">
      <sc-for list="{{ faqs }}" as="faq" hint-placeholder-count="8">
        <div style="border-top: 1px solid var(--color-divider);">
          <button type="button" onClick="{{ faq.toggle }}" style="all: unset; display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; cursor: pointer; padding: 22px 0;">
            <span style="font-size: 16.5px; font-weight: 600;">{{ faq.q }}</span>
            <span style="font-family: var(--font-heading); font-size: 18px; color: var(--color-accent-700); flex: none;">{{ faq.sign }}</span>
          </button>
          <sc-if value="{{ faq.open }}" hint-placeholder-val="{{ false }}">
            <p style="font-size: 14.5px; color: color-mix(in srgb, var(--color-text) 78%, transparent); line-height: 1.85; margin: 0 0 22px;">{{ faq.a }}</p>
          </sc-if>
        </div>
      </sc-for>
      <div style="border-top: 1px solid var(--color-divider);"></div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { faqData: [], open: -1 };

  async componentDidMount() {
    const mod = await import('./content-data.js');
    this.setState({ faqData: mod.faqData });
  }

  toggle(i) {
    this.setState(s => ({ open: s.open === i ? -1 : i }));
  }

  renderVals() {
    const faqs = this.state.faqData.map((f, i) => ({
      q: f.q, a: f.a,
      open: this.state.open === i,
      sign: this.state.open === i ? '−' : '+',
      toggle: () => this.toggle(i)
    }));
    return { faqs };
  }
}
</script>
</body>
</html>
