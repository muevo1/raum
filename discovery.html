<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아빠들의 발견 · HERWAY CLUB</title>
<link rel="stylesheet" href="site-style.css">
<script src="site-data.js"></script>
<style>
  body { margin: 0; word-break: keep-all; text-wrap: pretty; }
  a { color: var(--color-accent-700); text-decoration: none; }
  a:hover { color: var(--color-accent-800); }
  .logo-mark { display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--color-accent); flex: none; }
</style>
</head>
<body style="background: var(--color-bg); color: var(--color-text); min-height: 100vh;">
  <nav class="nav" style="border-bottom: 1px solid var(--color-divider); padding: 18px clamp(20px,5vw,64px);">
    <a href="index.html" style="display: flex; align-items: center; gap: 8px; color: inherit;">
      <span class="logo-mark"></span>
      <span class="nav-brand" style="margin: 0; font-size: 16px;">HERWAY CLUB</span>
      <span style="font-size: 9px; letter-spacing: 0.18em; color: var(--color-accent-700);">허웨이클럽</span>
    </a>
  </nav>
  <div style="max-width: 680px; margin: 0 auto; padding: 56px clamp(20px,5vw,64px) 140px;">
    <a href="index.html#discoveries" style="font-size: 13px;">← 아빠들의 발견으로</a>
    <div class="blueprint" style="height: 240px; margin: 24px 0 24px;"><img id="d-img" style="width: 100%; height: 100%; object-fit: cover; display: block;"></div>
    <div id="d-tags" style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px;"></div>
    <h1 id="d-title" style="font-size: clamp(24px,3vw,32px); line-height: 1.35; letter-spacing: -0.015em; margin: 0 0 16px;"></h1>
    <p id="d-detail" style="font-size: 15px; color: color-mix(in srgb, var(--color-text) 78%, transparent); line-height: 1.85; margin: 0 0 24px;"></p>
    <div class="card" style="gap: 10px; padding: 22px;">
      <div style="display: flex; justify-content: space-between; font-size: 14px; gap: 16px;"><span style="color: color-mix(in srgb, var(--color-text) 60%, transparent);">지출</span><span id="d-spent"></span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; gap: 16px;"><span style="color: color-mix(in srgb, var(--color-text) 60%, transparent);">아쉬운 점</span><span id="d-note"></span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; gap: 16px;"><span style="color: color-mix(in srgb, var(--color-text) 60%, transparent);">작성자</span><span id="d-author"></span></div>
    </div>
  </div>
<script>
const D = window.SITE_DATA;
const id = parseInt(new URLSearchParams(location.search).get('id') || '0', 10);
const d = D.discoveries[id] || D.discoveries[0];
document.getElementById('d-img').src = d.img; document.getElementById('d-img').alt = d.imgHint;
document.getElementById('d-tags').innerHTML = `<span class="tag tag-accent">${d.age}</span>` + (d.sponsored ? '<span class="tag" style="background: var(--color-accent-800); color: var(--color-bg);">광고·협찬</span>' : '<span class="tag tag-neutral">예시</span>');
document.getElementById('d-title').textContent = d.title;
document.getElementById('d-detail').textContent = d.detail;
document.getElementById('d-spent').textContent = d.spent;
document.getElementById('d-note').textContent = d.note;
document.getElementById('d-author').textContent = d.age + ' 딸 아빠';
</script>
</body>
</html>
