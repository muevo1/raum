<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/industry-26a06414-09cd-4924-8c02-5d57c1b41497/styles.css">
  <script src="_ds/industry-26a06414-09cd-4924-8c02-5d57c1b41497/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
  <style>
    body { margin: 0; word-break: keep-all; text-wrap: pretty; }
    a { color: var(--color-accent-700); text-decoration: none; }
    a:hover { color: var(--color-accent-800); }
  </style>
</helmet>

<div style="background: var(--color-bg); color: var(--color-text); min-height: 100vh;">
  <nav class="nav" style="border-bottom: 1px solid var(--color-divider); padding: 18px clamp(20px,5vw,64px);">
    <a href="나란히 홈페이지.dc.html" style="display: flex; align-items: center; gap: 8px; color: inherit;">
      <span style="display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--color-accent); flex: none;"></span>
      <span class="nav-brand" style="margin: 0; font-size: 16px;">HERWAY CLUB</span>
      <span style="font-size: 9px; letter-spacing: 0.18em; color: var(--color-accent-700);">허웨이클럽</span>
    </a>
  </nav>

  <div style="max-width: 680px; margin: 0 auto; padding: 56px clamp(20px,5vw,64px) 140px;">
    <a href="나란히 홈페이지.dc.html#discoveries" style="font-size: 13px;">← 아빠들의 발견으로</a>

    <div class="blueprint" style="height: 240px; margin: 24px 0 24px;">
      <image-slot id="discovery-detail-{{ discoveryId }}" shape="rect" placeholder="{{ d.imgHint }}" style="width: 100%; height: 100%;"></image-slot>
    </div>

    <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px;">
      <span class="tag tag-accent">{{ d.age }}</span>
      <sc-if value="{{ d.sponsored }}" hint-placeholder-val="{{ false }}">
        <span class="tag" style="background: var(--color-accent-800); color: var(--color-bg);">광고·협찬</span>
      </sc-if>
      <sc-if value="{{ d.notSponsored }}" hint-placeholder-val="{{ true }}">
        <span class="tag tag-neutral">예시</span>
      </sc-if>
    </div>
    <h1 style="font-size: clamp(24px,3vw,32px); line-height: 1.35; letter-spacing: -0.015em; margin: 0 0 16px;">{{ d.title }}</h1>
    <p style="font-size: 15px; color: color-mix(in srgb, var(--color-text) 78%, transparent); line-height: 1.85; margin: 0 0 24px;">{{ d.detail }}</p>

    <div class="card" style="gap: 10px; padding: 22px;">
      <div style="display: flex; justify-content: space-between; font-size: 14px; gap: 16px;"><span style="color: color-mix(in srgb, var(--color-text) 60%, transparent);">지출</span><span>{{ d.spent }}</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; gap: 16px;"><span style="color: color-mix(in srgb, var(--color-text) 60%, transparent);">아쉬운 점</span><span>{{ d.note }}</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; gap: 16px;"><span style="color: color-mix(in srgb, var(--color-text) 60%, transparent);">작성자</span><span>{{ d.age }} 딸 아빠</span></div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { d: null, discoveryId: 0 };

  async componentDidMount() {
    const mod = await import('./content-data.js');
    const id = parseInt(new URLSearchParams(window.location.search).get('id') || '0', 10);
    const item = mod.discoveries[id] || mod.discoveries[0];
    this.setState({ d: { ...item, notSponsored: !item.sponsored }, discoveryId: id });
  }

  renderVals() {
    return {
      d: this.state.d || { imgHint: '', age: '', title: '', detail: '', spent: '', note: '', sponsored: false, notSponsored: true },
      discoveryId: this.state.discoveryId
    };
  }
}
</script>
</body>
</html>
