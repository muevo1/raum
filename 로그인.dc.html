<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/industry-26a06414-09cd-4924-8c02-5d57c1b41497/styles.css">
  <script src="_ds/industry-26a06414-09cd-4924-8c02-5d57c1b41497/_ds_bundle.js"></script>
  <style>
    body { margin: 0; word-break: keep-all; text-wrap: pretty; }
    a { color: var(--color-accent-700); text-decoration: none; }
    a:hover { color: var(--color-accent-800); }
  </style>
</helmet>

<div style="background: var(--color-bg); color: var(--color-text); min-height: 100vh;">
  <nav class="nav" style="border-bottom: 1px solid var(--color-divider); padding: 18px clamp(20px,5vw,64px);">
    <a href="나란히 홈페이지.dc.html" style="display: flex; align-items: center; gap: 8px; color: inherit;">
      <span style="display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--color-accent); flex: none;"></span>
      <span class="nav-brand" style="margin: 0; font-size: 16px;">HERWAY CLUB</span>
      <span style="font-size: 9px; letter-spacing: 0.18em; color: var(--color-accent-700);">허웨이클럽</span>
    </a>
  </nav>

  <div style="max-width: 400px; margin: 0 auto; padding: 88px clamp(20px,5vw,64px) 140px;">
    <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
      <h1 style="font-size: 28px; letter-spacing: -0.015em; margin: 0 0 28px; text-align: center;">로그인</h1>
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div class="field">
          <label>이메일</label>
          <input class="input" type="email" placeholder="you@example.com" value="{{ email }}" onChange="{{ setEmail }}" />
        </div>
        <div class="field">
          <label>비밀번호</label>
          <input class="input" type="password" placeholder="••••••••" value="{{ password }}" onChange="{{ setPassword }}" />
        </div>
        <button type="button" class="btn btn-primary btn-block" style="height: 46px;" onClick="{{ login }}">로그인</button>
        <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
          <p style="font-size: 13px; color: var(--color-accent-800); margin: 0; text-align: center;">이메일과 비밀번호를 입력해 주세요.</p>
        </sc-if>
        <p style="font-size: 13px; color: color-mix(in srgb, var(--color-text) 55%, transparent); text-align: center; margin: 8px 0 0;">계정이 없으신가요? <a href="가입신청.dc.html">가입 신청하기</a></p>
      </div>
    </sc-if>
    <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
      <div style="text-align: center;">
        <h1 style="font-size: 26px; letter-spacing: -0.015em; margin: 0 0 12px;">로그인되었습니다.</h1>
        <p style="font-size: 14.5px; color: color-mix(in srgb, var(--color-text) 78%, transparent); line-height: 1.8; margin: 0 0 28px;">{{ email }}로 접속했습니다. (프로토타입 화면입니다)</p>
        <a href="나란히 홈페이지.dc.html" class="btn btn-primary" style="height: 46px; padding: 0 26px;">홈으로 이동</a>
      </div>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { email: '', password: '', done: false, showError: false };

  setEmail(e) { this.setState({ email: e.target.value }); }
  setPassword(e) { this.setState({ password: e.target.value }); }

  login() {
    if (!this.state.email || !this.state.password) {
      this.setState({ showError: true });
      return;
    }
    this.setState({ done: true, showError: false });
  }

  renderVals() {
    return {
      email: this.state.email,
      password: this.state.password,
      showError: this.state.showError,
      isForm: !this.state.done,
      isDone: this.state.done,
      setEmail: (e) => this.setEmail(e),
      setPassword: (e) => this.setPassword(e),
      login: () => this.login()
    };
  }
}
</script>
</body>
</html>
